<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bahar Restaurant | رستوران بهار</title>
    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
<!-- همون کانتیری بزرگه کرم کم رنگ خوشکله که پشت زمینه همه چیزه -->
    <div class="outer-container">
     <!-- همون کانتیری که دیده نمیشه ولی همه چیزا توش هستند -->
<div class="container">
    <!-- Main Header -->
    <header class="main-header">

        <!-- Website Logo -->
        <div class="logo">
            <img src="logo.png" alt="لوگوی رستوران بهار">
        </div>
        <button class="menu-toggle" aria-label="باز کردن منو">
    ☰
</button>
          <!-- Main Navigation -->
    <nav class="main-nav">
<button class="menu-close" aria-label="بستن منو">
    ×
</button>
        <ul>
            <li><a href="#menu">منوها</a></li>
            <li><a href="#gallery">گالری</a></li>
            <li><a href="#about">درباره ما</a></li>
        </ul>

    </nav>
<div class="menu-overlay"></div>

    </header>
<section class="order-bar">

    <div class="order-message">
        همین حالا سفارش بده، 40 دقیقه بعد درب منزل تحویل بگیر
    </div>

   <div class="phone-reservation">
    <span>رزرو تلفنی</span>

    <a href="tel:09123456789">
        <span>09123456789</span>
        <span>☎</span>
    </a>
</div>
</section>
<!-- hero mostatil red baraye axe ghaza -->
<section class="hero-section">

    <div class="slider">
        <img src="images/slide1.webp" class="slide active" alt="غذای رستوران بهار">
        <img src="images/slide2.webp" class="slide" alt="غذای رستوران بهار">
        <img src="images/slide3.webp" class="slide" alt="غذای رستوران بهار">
    </div>
<!-- دکمه های قبلی و بعدی -->
<button class="slider-arrow prev">&#10094;</button>
<button class="slider-arrow next">&#10095;</button>

<!-- نقطه های راهنمای اسلایدر -->
<div class="slider-dots">
    <button class="dot active"></button>
    <button class="dot"></button>
    <button class="dot"></button>
</div>
    <div class="hero-logo">
        <img src="logo.png" alt="لوگوی رستوران بهار">
    </div>

</section>
<!-- کل سکشن خدمات رستوران بهار -->
<section class="services-section">

    <h2>خدمات کافه رستوران بهار</h2>

    <div class="services-cards">

        <article class="service-card">
            <img src="images/online-order.jpg" alt="سفارش آنلاین">
            <h3><a href="#online-order">سفارش آنلاین</a></h3>
        </article>

        <article class="service-card">
            <img src="images/reservation.jpg" alt="رزرو میز">
            <h3><a href="#reservation">رزرو میز</a></h3>
        </article>

        <article class="service-card">
            <img src="images/catering.jpg" alt="پذیرایی مراسم">
            <h3><a href="#catering">پذیرایی مراسم</a></h3>
        </article>
    </div>

</section><!-- بسته شدن کل سکشن خدمات رستوران بهار -->




</div><!-- بسته شدن همون کانتیری که دیده نمشه ولی همه چی توشه-->
</div><!--بسته شدن کانتینر کرم کمرنگ پشت زمینه-->
</body>
</html>
